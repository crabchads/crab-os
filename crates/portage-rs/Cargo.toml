[package]
name = "portage-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "emerge"
path = "src/main.rs"

[dependencies]
brush-core = "0.3.1"
clap = { version = "4.5.39", features = ["derive"] }
petgraph = "0.8.1"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros"] }
winnow = { version = "0.7.10", features = ["simd"] }
