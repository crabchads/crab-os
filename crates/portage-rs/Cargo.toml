[package]
name = "portage-rs"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "emerge"
path = "src/emerge.rs"

[dependencies]
annotate-snippets = { git = "https://github.com/rust-lang/annotate-snippets-rs", version = "0.11.5" }
anstream = "0.6.19"
brush-core = "0.3.1"
clap = { version = "4.5.39", features = ["derive"] }
logos = { version = "0.15.0", default-features = false, features = [
    "export_derive",
    "logos-derive",
] }
petgraph = "0.8.1"
tokio = { version = "1.45.1", features = ["rt-multi-thread", "macros"] }
